[project]
name = "hermione"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.49.2",
    "datasets>=4.8.5",
    "peft>=0.14.0",
    "gjson>=1.1.0",
    "pandas>=3.0.3",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.5.1",
    "tensorboard>=2.20.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "matplotlib>=3.10.9",
    "transformers[torch]>=5.9.0",
    "openai>=2.46.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "ANN", # type annotations warnings
    "S"    # security bandit
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
